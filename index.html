<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#f7f4ed" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="셀러" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/app-icon-192.png?v=20260624-cellar-icon" />
  <link rel="apple-touch-icon" href="icons/app-icon-180.png?v=20260624-cellar-icon" />
  <link rel="manifest" href="manifest.json?v=20260624-cellar-icon" />
  <link rel="stylesheet" href="styles.css?v=20260625-variety-filter" />
  <title>셀러</title>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="app-header__top">
        <div class="app-header__brand">
          <img class="app-header__mark" src="icons/app-icon-192.png?v=20260624-cellar-icon" alt="" aria-hidden="true" />
          <h1 class="app-header__title">셀러</h1>
        </div>
        <button class="sync-pill sync-pill--local" id="syncBtn" type="button" aria-label="동기화 설정">
          <span class="sync-pill__dot" aria-hidden="true"></span>
          <span id="syncText">로컬</span>
        </button>
      </div>
      <p class="app-header__sub" id="headerSub">나의 와인 컬렉션</p>
    </header>

    <nav class="tabs" role="tablist">
      <button class="tab is-active" data-tab="cellar" role="tab">셀러</button>
      <button class="tab" data-tab="drunk" role="tab">기록</button>
      <button class="tab" data-tab="stats" role="tab">통계</button>
    </nav>

    <main class="view" id="view"></main>

    <button class="fab" id="addBtn" aria-label="와인 추가">
      <span class="fab__plus">+</span>
    </button>
  </div>

  <div class="backdrop" id="backdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></section>

  <script src="app.js?v=20260628-ready-white-photos"></script>
</body>
</html>
